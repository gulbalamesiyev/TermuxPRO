name: "Bug report"
description: "Create a report to help us improve"
title: "[Bug]: "
labels: ["bug report"]
body:
  - type: markdown
    attributes:
      value: |
        **THIS IS A BUG TRACKER FOR TERMUX PRO. IF YOU HAVE ISSUES WITH A PACKAGE INSIDE THE APP, PLEASE OPEN AN ISSUE AT [TERMUX/TERMUX-PACKAGES](https://github.com/termux/termux-packages) INSTEAD.**

        Use search before you open an issue to check whether your issue has been already reported.

        Android versions < 7.0 are not supported for the default build.
  - type: textarea
    attributes:
      label: Problem description
      description: |
        A clear and concise description of what the problem is. You may attach the logs, screenshots, screen video recording and whatever else that will help to understand the issue.

        Issues without proper description will be closed without solution.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce the behavior.
      description: |
        Please post all necessary commands that are needed to reproduce the issue.
    validations:
      required: true
  - type: textarea
    attributes:
      label: What is the expected behavior?
  - type: textarea
    attributes:
      label: System information
      description: Please provide info about your device
      value: |
        * Termux application version:
        * Android OS version:
        * Device model:
    validations:
      required: true
