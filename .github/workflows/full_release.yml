name: Full Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        package_variant: [ apt-android-7 ] # You can add apt-android-5 if needed

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APKs
        shell: bash {0}
        env:
          PACKAGE_VARIANT: ${{ matrix.package_variant }}
        run: |
          RELEASE_TAG="${GITHUB_REF/refs\/tags\//}"
          echo "Building Release APKs for $RELEASE_TAG"
          
          chmod +x gradlew
          ./gradlew assembleRelease

          echo "Collecting and renaming APKs for release"
          mkdir -p release_assets
          
          # Search for all generated APKs recursively in the app build directory
          found_apks=false
          find app/build/outputs/apk/ -name "*.apk" | while read -r apk; do
            filename=$(basename "$apk")
            # Skip unsigned or other internal APKs if necessary, but here we take all release ones
            if [[ $apk == *"release"* ]]; then
              # Professional naming: termux-pro_v1.0.5_apt-android-7_arm64-v8a.apk
              ABI=$(echo "$filename" | sed 's/app-//; s/-release.apk//; s/unsigned-//; s/.apk//')
              if [ -z "$ABI" ] || [ "$ABI" == "release" ]; then ABI="universal"; fi
              
              NEW_NAME="termux-pro_${RELEASE_TAG}_${{ env.PACKAGE_VARIANT }}_${ABI}.apk"
              cp "$apk" "release_assets/$NEW_NAME"
              echo "Prepared: $NEW_NAME"
              found_apks=true
            fi
          done

          # Create checksums only if APKs were found to avoid 0-byte file error
          cd release_assets
          if ls *.apk >/dev/null 2>&1; then
            sha256sum *.apk > "sha256sums.txt"
            echo "Checksums generated."
          else
            echo "Error: No release APKs found!"
            exit 1
          fi
          cd ..

      - name: Get previous tag
        id: get_prev_tag
        run: |
          git fetch --tags
          PREV_TAG=$(git tag --sort=-v:refname | sed -n '2p')
          echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          name: Termux Pro ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## 🚀 Termux Pro ${{ github.ref_name }} - $(date -u +'%Y-%m-%d %H:%M')

            Welcome to the latest release of **Termux Pro**, the ultimate terminal experience for Android.

            ### 🔗 History
            - **Commit History**: [${{ steps.get_prev_tag.outputs.prev_tag }}...${{ github.ref_name }}](https://github.com/${{ github.repository }}/compare/${{ steps.get_prev_tag.outputs.prev_tag }}...${{ github.ref_name }})

            ### ✨ Highlights
            - **Full Universal Build**: All architectures bundled in a single APK (~160MB).
            - **Native Optimizations**: Improved X11 rendering and shell performance.
            - **Professional UI**: Enhanced prompt and environment configuration.

            ### 📦 Installation
            Download the APK suitable for your device architecture from the **Assets** section below:
            - **Universal**: `termux-app_..._universal.apk` (Recommended - works on all devices)
            - **Architecture Specific**: Smaller APKs if you know your device type (`arm64-v8a`, etc.)

            ### 🛠 Developer
            Developed and optimized by **[gulbalamesiyev](https://github.com/gulbalamesiyev)**.

            ---
            *Note: These APKs are signed with a test key. If you have a previous version installed, you must uninstall it first.*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
